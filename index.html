<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสแกน QR Code บันทึกสินค้า</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 450px; margin: auto; background-color: #f4f6f9; color: #333; }
    h3 { text-align: center; margin-bottom: 15px; color: #1a73e8; }
    #video-container { width: 100%; position: relative; margin-bottom: 15px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; height: auto; display: block; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 12px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background-color: #fff; }
    input[readonly] { background-color: #e9ecef; color: #495057; border: 1px solid #dee2e6; }
    .btn { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-camera { background: #28a745; color: white; margin-bottom: 10px; }
    .btn-stop { background: #dc3545; color: white; display: none; margin-bottom: 10px; }
    .btn-submit { background: #1a73e8; color: white; margin-top: 10px; box-shadow: 0 2px 4px rgba(26,115,232,0.3); }
    .loading-text { color: #f39c12; font-size: 14px; font-style: italic; display: none; }
    /* กล่องแสดงสถานะเพื่อหาจุดเสีย */
    #debug-log { background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; font-family: monospace; display: none; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h3>🎥 ระบบสแกน QR Code สดผ่านเว็บ</h3>
  
  <!-- แสดงปัญหาทางเทคนิค -->
  <div id="debug-log"></div>
  
  <div id="video-container">
    <video id="video" playsinline></video>
  </div>
  
  <button type="button" id="btnStart" class="btn btn-camera">📷 เปิดกล้องสแกนสด</button>
  <button type="button" id="btnStop" class="btn btn-stop">🛑 ปิดกล้อง</button>

  <form id="scanForm">
    <div class="form-group">
      <label>รหัสสินค้า:</label>
      <input type="text" id="productCode" readonly required placeholder="รอผลการสแกน QR Code...">
    </div>
    <div class="form-group">
      <label>ชื่อสินค้า: <span id="loadingName" class="loading-text">กำลังค้นหาชื่อ...</span></label>
      <input type="text" id="productName" readonly required placeholder="ชื่อสินค้าจะแสดงอัตโนมัติ">
    </div>
    <div class="form-group">
      <label>จำนวนสินค้า:</label>
      <input type="number" id="qty" required value="1" min="1">
    </div>
    <div class="form-group">
      <label>ชื่อผู้บันทึกข้อมูล:</label>
      <input type="text" id="recorder" required placeholder="ระบุชื่อผู้บันทึก">
    </div>
    <button type="submit" class="btn btn-submit">💾 บันทึกข้อมูลสินค้า</button>
  </form>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwXWBeHnUNvztQESMyGi0KM1GCM_OVkkn4DtBxOkExE7-1X3Z3HprBdO02Ge9n6FUTU/exec"; 

    const video = document.getElementById("video");
    const videoContainer = document.getElementById("video-container");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");
    const debugLog = document.getElementById("debug-log");
    
    let localStream = null;
    let scanning = false;
    let canvasElement = document.createElement("canvas");
    let canvasCtx = canvasElement.getContext("2d");

    function logError(msg) {
      debugLog.style.display = "block";
      debugLog.innerText += msg + "\n";
    }

    // ตรวจสอบเบื้องต้นว่าระบบมีไลบรารีครบไหม
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof jsQR === 'undefined') {
        logError("❌ Error: โหลดไลบรารี jsQR ไม่สำเร็จ! ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต");
      }
      if (window.location.protocol === 'file:') {
        logError("⚠️ Warning: คุณเปิดไฟล์แบบ file:// บราวเซอร์จะบล็อกการอ่านรหัสพิกเซลภาพ ให้เปลี่ยนไปรันบนเว็บที่เป็น https:// หรือ localhost");
      }
    });

    btnStart.addEventListener('click', async function() {
      try {
        debugLog.innerText = ""; // ล้าง log เก่า
        const constraints = {
          video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
        };
        
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        localStream = stream;
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        
        scanning = true;
        videoContainer.style.display = "block";
        btnStart.style.display = "none";
        btnStop.style.display = "block";
        
        requestAnimationFrame(tick);
      } catch (err) {
        logError("❌ ไม่สามารถเข้าถึงกล้องได้: " + err.message);
      }
    });

    btnStop.addEventListener('click', stopScanner);
    
    function stopScanner() {
      scanning = false;
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      videoContainer.style.display = "none";
      btnStart.style.display = "block";
      btnStop.style.display = "none";
      video.srcObject = null;
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
        try {
          canvasElement.height = video.videoHeight;
          canvasElement.width = video.videoWidth;
          
          canvasCtx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
          var imageData = canvasCtx.getImageData(0, 0, canvasElement.width, canvasElement.height);
          
          var code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert",
          });

          if (code && code.data.trim() !== "") {
            document.getElementById('productCode').value = code.data;
            document.getElementById('loadingName').style.display = 'inline';
            document.getElementById('productName').value = '';
            
            stopScanner();

            fetch(`${WEB_APP_URL}?code=${encodeURIComponent(code.data)}`)
              .then(res => res.json())
              .then(data => {
                document.getElementById('productName').value = data.productName;
                document.getElementById('loadingName').style.display = 'none';
              })
              .catch(err => {
                logError("❌ ดึงข้อมูลจาก Sheets ผิดพลาด: " + err.message);
                document.getElementById('loadingName').style.display = 'none';
              });
            return;
          }
        } catch (canvasErr) {
          logError("❌ บราวเซอร์บล็อกความปลอดภัยภาพ (Security Error): " + canvasErr.message);
          scanning = false;
          return;
        }
      }
      
      if (scanning) {
        setTimeout(function() {
          requestAnimationFrame(tick);
        }, 60);
      }
    }

    document.getElementById('scanForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var productName = document.getElementById('productName').value;
      if (productName === "ไม่พบข้อมูลสินค้า" || productName === "" || productName === "ชื่อสินค้าว่างเปล่าในระบบ") {
        alert("กรุณาสแกนรหัสสินค้าที่มีในระบบตารางก่อนกดบันทึก"); 
        return;
      }
      
      var data = {
        productCode: document.getElementById('productCode').value,
        productName: productName,
        qty: document.getElementById('qty').value,
        recorder: document.getElementById('recorder').value
      };
      
      fetch(WEB_APP_URL, { 
        method: "POST", 
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(data) 
      })
      .then(() => {
        alert("ส่งข้อมูลบันทึกสำเร็จ!");
        document.getElementById('productCode').value = '';
        document.getElementById('productName').value = '';
        document.getElementById('qty').value = '1';
      })
      .catch(err => alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล"));
    });
  </script>
</body>
</html>
