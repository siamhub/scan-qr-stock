<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ระบบสแกน QR Code บันทึกสินค้า</title>
  <!-- โหลดไลบรารีเวอร์ชันล่าสุดที่รองรับเบราว์เซอร์ยุคใหม่ -->
  <script src="https://cloudflare.com" integrity="sha512-r6rDA7W6ZeQhvl8S7yRVQUKVV234Cp0pVIFz8gL4xbS47cC2W7GQHECp3cONYu5ypJgwkWcM81LOin9ssVbASg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 450px; margin: auto; background-color: #f4f6f9; color: #333; }
    h3 { text-align: center; margin-bottom: 20px; color: #1a73e8; }
    #reader { width: 100%; min-height: 280px; background: #000; border-radius: 12px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 12px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background-color: #fff; }
    input[readonly] { background-color: #e9ecef; color: #495057; border: 1px solid #dee2e6; }
    .btn { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-camera { background: #28a745; color: white; }
    .btn-camera:hover { background: #218838; }
    .btn-stop { background: #dc3545; color: white; display: none; }
    .btn-submit { background: #1a73e8; color: white; margin-top: 15px; width: 100%; box-shadow: 0 2px 4px rgba(26,115,232,0.3); }
    .btn-submit:hover { background: #1557b0; }
    .loading-text { color: #f39c12; font-size: 14px; font-style: italic; display: none; }
  </style>
</head>
<body>

  <h3>📸 ระบบสแกน QR Code บันทึกสินค้า</h3>
  
  <div id="reader"></div>
  <button type="button" id="btnStart" class="btn btn-camera">📷 เปิดกล้องสแกน QR Code</button>
  <button type="button" id="btnStop" class="btn btn-stop">🛑 ปิดกล้อง</button>

  <form id="scanForm">
    <div class="form-group">
      <label>รหัสสินค้า:</label>
      <input type="text" id="productCode" readonly required placeholder="กดเปิดกล้องเพื่อสแกน">
    </div>
    <div class="form-group">
      <label>ชื่อสินค้า: <span id="loadingName" class="loading-text">กำลังค้นหา...</span></label>
      <input type="text" id="productName" readonly required placeholder="ชื่อสินค้าจะขึ้นอัตโนมัติ">
    </div>
    <div class="form-group">
      <label>จำนวนสินค้า:</label>
      <input type="number" id="qty" required value="1" min="1">
    </div>
    <div class="form-group">
      <label>ชื่อผู้บันทึกข้อมูล:</label>
      <input type="text" id="recorder" required placeholder="ระบุชื่อผู้บันทึก">
    </div>
    <button type="submit" class="btn btn-submit">💾 บันทึกข้อมูลสินค้า</button>
  </form>

  <script>
    // 🌟 ใส่ URL ของ Google Apps Script ที่ลงท้ายด้วย /exec ของคุณตรงนี้ตามเดิม
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwXWBeHnUNvztQESMyGi0KM1GCM_OVkkn4DtBxOkExE7-1X3Z3HprBdO02Ge9n6FUTU/exec"; 

    let html5QrCode;
    const cameraId = "reader";

    document.getElementById('btnStart').addEventListener('click', function() {
      // เคลียร์องค์ประกอบเก่าก่อนสร้างตัวสแกนใหม่ เพื่อป้องกันอินสแตนซ์ซ้ำซ้อน
      if (html5QrCode) {
        html5QrCode.clear();
      }
      
      html5QrCode = new Html5Qrcode(cameraId);
      
      // บังคับเจาะจงขอกล้องหลังโดยใช้นโยบายความปลอดภัยปี 2026
      html5QrCode.start(
        { facingMode: { exact: "environment" } }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          document.getElementById('productCode').value = decodedText;
          document.getElementById('loadingName').style.display = 'inline';
          document.getElementById('productName').value = '';
          
          fetch(`${WEB_APP_URL}?code=${encodeURIComponent(decodedText)}`)
            .then(res => res.json())
            .then(data => {
              document.getElementById('productName').value = data.productName;
              document.getElementById('loadingName').style.display = 'none';
              stopCamera(); 
            })
            .catch(err => {
              alert("เชื่อมต่อหลังบ้านล้มเหลว");
              document.getElementById('loadingName').style.display = 'none';
            });
        }, 
        (error) => {}
      ).then(() => {
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'block';
      }).catch(err => {
        // หากมือถือไม่มีกล้องหลังแบบ exact ให้ถอยกลับไปใช้โหมดสภาพแวดล้อมทั่วไปแทน
        console.log("ถอยกลับไปใช้ facingMode แบบทั่วไป");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            document.getElementById('productCode').value = decodedText;
            document.getElementById('loadingName').style.display = 'inline';
            document.getElementById('productName').value = '';
            
            fetch(`${WEB_APP_URL}?code=${encodeURIComponent(decodedText)}`)
              .then(res => res.json())
              .then(data => {
                document.getElementById('productName').value = data.productName;
                document.getElementById('loadingName').style.display = 'none';
                stopCamera();
              });
          },
          (error) => {}
        ).then(() => {
          document.getElementById('btnStart').style.display = 'none';
          document.getElementById('btnStop').style.display = 'block';
        }).catch(e => {
          alert("ไม่สามารถเข้าถึงกล้องได้จริง ๆ กรุณาเช็กการอนุญาตสิทธิ์ในบราวเซอร์ของคุณ: " + e);
        });
      });
    });

    document.getElementById('btnStop').addEventListener('click', stopCamera);
    
    function stopCamera() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnStop').style.display = 'none';
          document.getElementById('reader').innerHTML = '';
        }).catch(err => console.error("Failed to stop", err));
      }
    }

    document.getElementById('scanForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var productName = document.getElementById('productName').value;
      
      if (productName === "ไม่พบข้อมูลสินค้า" || productName === "") {
        alert("ไม่พบรหัสสินค้านี้ในระบบ ไม่สามารถบันทึกได้"); 
        return;
      }
      
      var data = {
        productCode: document.getElementById('productCode').value,
        productName: productName,
        qty: document.getElementById('qty').value,
        recorder: document.getElementById('recorder').value
      };
      
      fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) })
        .then(res => res.json())
        .then(resData => {
          alert(resData.message);
          document.getElementById('productCode').value = '';
          document.getElementById('productName').value = '';
          document.getElementById('qty').value = '1';
        }).catch(err => alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล"));
    });
  </script>
</body>
</html>
