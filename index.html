<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสแกน QR Code บันทึกสินค้า</title>
  <!-- โหลดไลบรารีสแกนสดความเร็วสูงเวอร์ชันเสถียรล่าสุด -->
  <script src="https://unpkg.com" type="text/javascript"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 450px; margin: auto; background-color: #f4f6f9; color: #333; }
    h3 { text-align: center; margin-bottom: 15px; color: #1a73e8; }
    #interactive-reader { width: 100%; min-height: 250px; background: #000; border-radius: 12px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 12px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background-color: #fff; }
    input[readonly] { background-color: #e9ecef; color: #495057; border: 1px solid #dee2e6; }
    .btn { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-camera { background: #28a745; color: white; margin-bottom: 10px; }
    .btn-stop { background: #dc3545; color: white; display: none; margin-bottom: 10px; }
    .btn-submit { background: #1a73e8; color: white; margin-top: 10px; box-shadow: 0 2px 4px rgba(26,115,232,0.3); }
    .loading-text { color: #f39c12; font-size: 14px; font-style: italic; display: none; }
  </style>
</head>
<body>

  <h3>🎥 ระบบสแกน QR Code สดผ่านเว็บ</h3>
  
  <!-- กล่องสแกนสดจากกล้อง -->
  <div id="interactive-reader"></div>
  
  <button type="button" id="btnStartScan" class="btn btn-camera">📷 เปิดกล้องสแกนสด</button>
  <button type="button" id="btnStopScan" class="btn btn-stop">🛑 ปิดกล้อง</button>

  <form id="scanForm">
    <div class="form-group">
      <label>รหัสสินค้า:</label>
      <input type="text" id="productCode" readonly required placeholder="รอผลการสแกน QR Code...">
    </div>
    <div class="form-group">
      <label>ชื่อสินค้า: <span id="loadingName" class="loading-text">กำลังค้นหาชื่อ...</span></label>
      <input type="text" id="productName" readonly required placeholder="ชื่อสินค้าจะแสดงอัตโนมัติ">
    </div>
    <div class="form-group">
      <label>จำนวนสินค้า:</label>
      <input type="number" id="qty" required value="1" min="1">
    </div>
    <div class="form-group">
      <label>ชื่อผู้บันทึกข้อมูล:</label>
      <input type="text" id="recorder" required placeholder="ระบุชื่อผู้บันทึก">
    </div>
    <button type="submit" class="btn btn-submit">💾 บันทึกข้อมูลสินค้า</button>
  </form>

  <script>
    // 🌟 เอา URL ของ Google Apps Script ที่ลงท้ายด้วย /exec มาใส่แทนข้อความนี้ตามเดิม
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwXWBeHnUNvztQESMyGi0KM1GCM_OVkkn4DtBxOkExE7-1X3Z3HprBdO02Ge9n6FUTU/exec"; 

    let html5QrCodeScanner;

    document.getElementById('btnStartScan').addEventListener('click', function() {
      // เรียกใช้โครงสร้างกล้องผ่านตัวจัดการ API ความปลอดภัยสูงของ html5-qrcode
      html5QrCodeScanner = new Html5Qrcode("interactive-reader");
      
      const config = { fps: 15, qrbox: { width: 250, height: 250 } };
      
      // บังคับการดึงสิทธิ์กล้องหลังแบบเรียบง่ายและปลอดภัยสูงสุด
      html5QrCodeScanner.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => {
          // เมื่อสแกนคิวอาร์สดสำเร็จ
          document.getElementById('productCode').value = decodedText;
          document.getElementById('loadingName').style.display = 'inline';
          document.getElementById('productName').value = '';
          
          // ส่งข้อความไปเช็กชื่อสินค้า
          fetch(`${WEB_APP_URL}?code=${encodeURIComponent(decodedText)}`)
            .then(res => res.json())
            .then(data => {
              document.getElementById('productName').value = data.productName;
              document.getElementById('loadingName').style.display = 'none';
              stopScanner(); // ค้นหาเจอแล้ว สั่งปิดวิดีโอกล้องสดทันที
            })
            .catch(err => {
              alert("ดึงข้อมูลชื่อสินค้าล้มเหลว");
              document.getElementById('loadingName').style.display = 'none';
            });
        },
        (errorMessage) => { /* ปล่อยให้ลูปสแกนเฟรมต่อไปทำงานต่อเนื่อง */ }
      ).then(() => {
        document.getElementById('btnStartScan').style.display = 'none';
        document.getElementById('btnStopScan').style.display = 'block';
      }).catch(err => {
        alert("⚠️ บราวเซอร์ไม่ยอมให้เปิดกล้องสแกนสด\n\nวิธีแก้:\n1. ตรวจสอบว่าเปิดผ่าน HTTPS\n2. ต้องก๊อปปี้ลิงก์ไปเปิดใน Google Chrome หรือ Safari ตรง ๆ เท่านั้น (ห้ามเปิดผ่านแอป LINE)");
      });
    });

    document.getElementById('btnStopScan').addEventListener('click', stopScanner);
    
    function stopScanner() {
      if (html5QrCodeScanner && html5QrCodeScanner.isScanning) {
        html5QrCodeScanner.stop().then(() => {
          document.getElementById('btnStartScan').style.display = 'block';
          document.getElementById('btnStopScan').style.display = 'none';
          document.getElementById('interactive-reader').innerHTML = '';
        }).catch(err => console.error(err));
      }
    }

    document.getElementById('scanForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var productName = document.getElementById('productName').value;
      if (productName === "ไม่พบข้อมูลสินค้า" || productName === "") {
        alert("กรุณาสแกนรหัสสินค้าที่มีในระบบตารางก่อนกดบันทึก"); return;
      }
      
      var data = {
        productCode: document.getElementById('productCode').value,
        productName: productName,
        qty: document.getElementById('qty').value,
        recorder: document.getElementById('recorder').value
      };
      
      fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) })
        .then(res => res.json())
        .then(resData => {
          alert(resData.message);
          document.getElementById('productCode').value = '';
          document.getElementById('productName').value = '';
          document.getElementById('qty').value = '1';
        }).catch(err => alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล"));
    });
  </script>
</body>
</html>
