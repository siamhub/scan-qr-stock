<!DOCTYPE html>
<html>
<head>
  <title>ระบบสแกนนับสต๊อคสินค้า</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- โหลดไลบรารีเวอร์ชันสากลจาก unpkg ที่เสถียรที่สุดสำหรับสแกนสด -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f3f4f6; padding: 15px; display: flex; justify-content: center; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; }
    h2 { text-align: center; color: #1f2937; margin: 0 0 15px 0; font-size: 1.25rem; }
    
    /* 💡 สำคัญ: แก้ไขกรอบสีดำค้าง ให้เป็นกรอบโปร่งใสรอการแสดงผลปุ่มควบคุม */
    #reader { width: 100%; background: #fafafa; border: 2px dashed #cbd5e1; border-radius: 8px; overflow: hidden; margin-bottom: 15px; min-height: 250px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #4b5563; font-size: 0.9rem; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
    .info-box { background-color: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; background-color: #2563eb; color: white; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    #status { padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; display: none; font-size: 0.9rem; }
    
    /* ปรับแต่งสไตล์ปุ่มของตัวไลบรารีสแกนที่แสดงขึ้นมาอัตโนมัติ */
    #reader button { background-color: #1e293b !important; color: white !important; border: none !important; padding: 8px 16px !important; border-radius: 4px !important; cursor: pointer !important; font-weight: bold !important; margin-top: 10px !important; }
    #reader select { padding: 6px !important; border-radius: 4px !important; border: 1px solid #cbd5e1 !important; margin-top: 5px !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 ระบบบันทึกสต๊อค (สแกน QR-Code)</h2>
    
    <div id="status"></div>
    
    <!-- จอภาพกล้องสแกนสดที่จะสร้างปุ่มขอสิทธิ์ให้กดอัตโนมัติ -->
    <div id="reader"></div>
    
    <div id="form-container">
      <div class="info-box">
        <p style="margin: 0;">รหัสสินค้า: <span id="prod-id" style="font-weight: bold; color: blue;">-</span></p>
        <p style="margin: 5px 0 0 0;">ชื่อสินค้า: <span id="prod-name" style="font-weight: bold; color: green;">-</span></p>
      </div>

      <div class="form-group">
        <label>จำนวนสินค้า</label>
        <input type="number" id="quantity" value="1">
      </div>

      <div class="form-group">
        <label>ชื่อผู้ทำรายการ</label>
        <input type="text" id="username" placeholder="ระบุชื่อของคุณ">
      </div>

      <button onclick="submitData()" id="btn-submit">บันทึกรายการ</button>
    </div>
  </div>

  <script>
    // 🔗 ⚠️ ตรวจสอบตรงนี้: วาง URL Web App ของกูเกิล (ต้องลงท้ายด้วย /exec เท่านั้น)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwsFnoDYSwY4f7ZDk9fa3ZNg4KV-X8qX6x5eyAKlWwO61ozTjH6In8YakmN5phYDy7w/exec"; 

    let html5QrcodeScanner;
    let currentProductId = "";
    let currentProductName = "";
    let isScanning = true;

    function startCamera() {
      // 1. ตรวจสอบว่าโหลด Library เสร็จจริงก่อนทำงาน
      if (typeof Html5QrcodeScanner === 'undefined') {
        setTimeout(startCamera, 200);
        return;
      }
      
      try {
        // 2. ปล่อยให้ Library จัดการสร้าง UI ปุ่ม "Request Camera Permissions" ขึ้นมาก่อนอย่างปลอดภัย
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
          fps: 10, 
          qrbox: { width: 250, height: 250 },
          rememberLastUsedCamera: true
        });
        
        // 3. สั่งเรนเดอร์องค์ประกอบบนหน้าเว็บ
        html5QrcodeScanner.render(onScanSuccess, onScanError);
      } catch (e) {
        showStatus("เกิดข้อผิดพลาดในการโหลดตัวสแกน: " + e.message, "#fee2e2", "#991b1b");
      }
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;
      
      currentProductId = decodedText.trim();
      showStatus("⏳ กำลังค้นหารหัสสินค้า: " + currentProductId, "#fef3c7", "#d97706");
      
      // ล้างสคริปต์ JSONP เก่าออกก่อน
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();
      
      // สร้างฟังก์ชันรอรับข้อมูลข้ามไซต์ (JSONP) ปลดล็อก CORS Block 100%
      window.handleGoogleResponse = function(result) {
        isScanning = true;
        if(result.success) {
          currentProductName = result.productName;
          document.getElementById('prod-id').innerText = currentProductId;
          document.getElementById('prod-name').innerText = currentProductName;
          showStatus("✅ พบข้อมูลสินค้า -->สำเร็จ!", "#d1fae5", "#065f46");
        } else {
          showStatus("❌ " + result.message, "#fee2e2", "#991b1b");
          document.getElementById('prod-id').innerText = currentProductId;
          document.getElementById('prod-name').innerText = "(ไม่พบสินค้า)";
        }
      };

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${WEB_APP_URL}?action=check&productId=${encodeURIComponent(currentProductId)}&callback=handleGoogleResponse`;
      document.body.appendChild(script);
    }

    function onScanError(err) {
      console.log("กำลังตรวจหาคิวอาร์โค้ด...");
    }

    function submitData() {
      const qty = document.getElementById('quantity').value;
      const user = document.getElementById('username').value;
      const btn = document.getElementById('btn-submit');

      if(!currentProductId) return alert("กรุณาสแกนรหัสสินค้าก่อน");
      if(!qty || qty == 0 || !user.trim()) return alert("กรุณากรอกจำนวนให้ถูกต้อง (เป็นบวกหรือลบก็ได้ แต่ต้องไม่ใช่ 0) และกรอกชื่อผู้ทำรายการ");

      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      window.handleSaveResponse = function(res) {
        showStatus("🎉 บันทึกข้อมูลลง Google Sheets สำเร็จแล้ว!", "#d1fae5", "#065f46");
        document.getElementById('quantity').value = 1;
        document.getElementById('prod-id').innerText = "-";
        document.getElementById('prod-name').innerText = "-";
        currentProductId = "";
        currentProductName = "";
        btn.disabled = false;
        btn.innerText = "บันทึกรายการ";
      };

      const script = document.createElement('script');
      script.src = `${WEB_APP_URL}?action=save&productId=${encodeURIComponent(currentProductId)}&productName=${encodeURIComponent(currentProductName)}&quantity=${encodeURIComponent(qty)}&userName=${encodeURIComponent(user)}&callback=handleSaveResponse`;
      document.body.appendChild(script);
    }

    function showStatus(msg, bgColor, textColor) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = msg;
      statusDiv.style.backgroundColor = bgColor;
      statusDiv.style.color = textColor;
      statusDiv.style.display = 'block';
    }

    // เริ่มรันฟังก์ชันหลังจากระบบโหลดหน้ากระดาษเสร็จ
    window.onload = startCamera;
  </script>
</body>
</html>
